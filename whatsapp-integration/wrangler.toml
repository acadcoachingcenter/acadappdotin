name = "calendar-whatsapp-lookup"
main = "index.js"
compatibility_date = "2026-08-01"

[[d1_databases]]
binding = "DB"
database_name = "calendar-whatsapp-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"   # from `wrangler d1 create` output

# After deploy, set the API key secret (do NOT hardcode it here):
#   wrangler secret put API_KEY
